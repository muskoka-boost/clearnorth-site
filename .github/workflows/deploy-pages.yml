name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Pages
        # enablement: true turns Pages on for the repo if it isn't already,
        # so this deploys without anyone visiting the settings screen.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build for the Pages origin
        # This deploy always publishes the development preview, whatever site.config.json
        # currently says — canonicals, Open Graph URLs and schema are rewritten to the
        # Pages origin, and robots.txt blocks crawling. A preview that inherited the
        # production config would put an indexable duplicate of the live site online.
        run: node scripts/apply-site-config.mjs --env=github-pages

      - name: Check the build
        run: |
          node scripts/check-pages.mjs --env=github-pages
          node scripts/check-location-uniqueness.mjs

      - name: Assemble the site
        # Ship only the site itself — no .git, no workflow, no tooling, no docs.
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude 'scripts' \
            --exclude 'data' \
            --exclude 'node_modules' \
            --exclude 'site.config.json' \
            --exclude '_config.yml' \
            --exclude '*.md' \
            ./ _site/
          # Stop Pages running the files through Jekyll.
          touch _site/.nojekyll
          echo "Files to publish:"
          find _site -type f | sort | sed 's/^/  /'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
